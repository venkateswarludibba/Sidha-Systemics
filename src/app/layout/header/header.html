<header>
  <div class="container bar">
    <app-logo />
    <button #menuButton class="menu" [class.open]="open()" type="button" (click)="toggle()" [attr.aria-expanded]="open()" aria-controls="main-nav" [attr.aria-label]="open() ? 'Close navigation' : 'Open navigation'"><span></span><span></span><span></span></button>
    <nav #navigation id="main-nav" [class.open]="open()" aria-label="Main navigation">
      <a routerLink="/features" routerLinkActive="active" (click)="close()">Features</a>
      <a routerLink="/solutions/schools" routerLinkActive="active" (click)="close()">Schools</a>
      <a routerLink="/solutions/colleges" routerLinkActive="active" (click)="close()">Colleges</a>
      <a routerLink="/pricing" routerLinkActive="active" (click)="close()">Pricing</a>
      <a routerLink="/resources" routerLinkActive="active" (click)="close()">Resources</a>
      <a routerLink="/about" routerLinkActive="active" (click)="close()">About Us</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="close()">Contact Us</a>
      <div class="mobile-actions"><a routerLink="/product-demo" (click)="close()">Sign in</a><app-button link="/book-demo" label="Book a demo" (click)="close()" /></div>
    </nav>
    <div class="desktop-actions"><a routerLink="/product-demo">Sign in</a><app-button link="/book-demo" label="Book a demo" /></div>
  </div>
</header>
